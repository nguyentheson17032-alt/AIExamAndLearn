services:
  postgres:
    image: postgres:16-alpine
    container_name: exam-warehouse-db
    environment:
      POSTGRES_DB: exam_warehouse
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
    ports:
      - "5432:5432"
    volumes:
      - exam-warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d exam_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  exam-warehouse-data:
