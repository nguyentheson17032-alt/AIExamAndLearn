spring:
  application:
    name: exam-warehouse
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/exam_warehouse}
    username: ${DATABASE_USERNAME:exam}
    password: ${DATABASE_PASSWORD:exam}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  mvc:
    problemdetails:
      enabled: true
  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 15m
    refresh-token-expiration: 7d
  ai:
    enabled: ${APP_AI_ENABLED:false}
  elo:
    default-rating: 1200
    default-k-factor: 24
    question-k-factor: 12

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
